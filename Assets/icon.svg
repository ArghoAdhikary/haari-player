<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2f7a"/><stop offset="1" stop-color="#120f33"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe27a"/><stop offset="0.5" stop-color="#ffb627"/><stop offset="1" stop-color="#ff7a1a"/>
    </linearGradient>
    <radialGradient id="disc" cx="0.45" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#4f8bff"/><stop offset="0.6" stop-color="#2346c9"/><stop offset="1" stop-color="#0f1f6e"/>
    </radialGradient>
    <linearGradient id="horse" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d9e6ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <!-- spinning ring -->
  <circle cx="512" cy="512" r="345" fill="none" stroke="url(#gold)" stroke-width="40"
          stroke-dasharray="520 203" stroke-linecap="round" transform="rotate(-20 512 512)" filter="url(#shadow)"/>
  <circle cx="512" cy="512" r="390" fill="none" stroke="#ffb627" stroke-opacity="0.35" stroke-width="10"
          stroke-dasharray="180 430" stroke-linecap="round" transform="rotate(40 512 512)"/>
  <circle cx="512" cy="512" r="300" fill="url(#disc)"/>
  <g filter="url(#shadow)">
    <!-- wing: curved feathers fanning up and back -->
    <g transform="translate(525 498)" fill="#dfe9ff">
      <path d="M0,-20 C110,-70 250,-80 330,-34 C250,-4 110,22 0,20 Z" transform="rotate(-178)"/>
      <path d="M0,-20 C110,-70 250,-80 325,-34 C250,-4 110,22 0,20 Z" transform="rotate(-160)"/>
      <path d="M0,-20 C110,-70 240,-78 305,-34 C240,-4 110,22 0,20 Z" transform="rotate(-142)"/>
      <path d="M0,-20 C100,-66 210,-72 270,-32 C210,-4 100,22 0,20 Z" transform="rotate(-124)"/>
      <path d="M0,-18 C90,-60 170,-64 220,-28 C170,-4 90,20 0,18 Z" transform="rotate(-106)"/>
    </g>
    <!-- tail -->
    <path fill="url(#horse)" d="M400 628 C340 636 296 690 286 772 C318 724 342 706 362 700 C342 736 336 768 342 800 C372 738 396 694 420 664 Z"/>
    <!-- horse silhouette -->
    <path fill="url(#horse)" stroke="#2346c9" stroke-width="7" stroke-linejoin="round" d="
      M560 470
      C520 500 470 540 420 575
      C395 590 385 615 392 640
      C395 680 410 700 420 722
      L405 776 L442 782 L450 730
      C452 702 470 682 486 668
      L506 722 L500 780 L534 782 L532 722
      C528 690 530 666 536 652
      C562 642 586 626 602 612
      L650 602 L666 652 L694 642 L682 596
      C676 580 660 572 640 568
      L660 546 L700 578 L720 562 L692 524
      C672 508 648 504 628 504
      C640 480 650 452 655 432
      L718 446
      C744 454 770 442 766 422
      C762 406 732 380 702 356
      L676 324 L672 288 L650 318
      C616 332 582 382 566 430
      C560 450 558 462 560 470 Z"/>
    <!-- mane: flame spikes along the neck -->
    <path fill="url(#gold)" d="M660 318 C640 300 612 296 590 304 C606 312 614 320 618 330 C596 324 572 330 556 344 C576 346 590 352 598 362
      C576 362 556 374 546 392 C566 390 580 394 588 402 C570 410 556 426 552 446 C566 436 578 432 590 432
      C584 410 600 370 628 340 C640 330 650 324 660 318 Z"/>
    <circle cx="708" cy="370" r="7" fill="#14245e"/>
  </g>
</svg>
